<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 Qiye RAG</title><style>body{font:16px system-ui;max-width:420px;margin:80px auto;padding:20px}input,button{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box}button{background:#2456c9;color:white;border:0}</style>
<h1>登录知识库</h1><form id="login"><input id="username" autocomplete="username" required placeholder="用户名"><input id="password" type="password" autocomplete="current-password" required placeholder="密码"><button>登录</button></form><p id="error"></p>
<script>document.getElementById('login').onsubmit=async e=>{e.preventDefault();try{const response=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});const result=await response.json();if(!response.ok)throw Error(result.detail);sessionStorage.setItem('rag_token',result.access_token);location.href='/';}catch(error){document.getElementById('error').textContent=error.message;}};</script></html>
