[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "qiye-rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pypdf>=5,<7", "python-docx>=1.2,<2", "PyYAML>=6,<7", "langchain-text-splitters>=0.3,<2", "langchain-milvus>=0.2,<1", "langchain-openai>=0.3,<2", "python-dotenv>=1,<2", "httpx>=0.27,<1", "pymilvus>=2.5,<3", "langgraph>=1,<2", "langgraph-checkpoint-sqlite>=3,<4", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "celery[redis]>=5.4,<6", "python-multipart>=0.0.18,<1", "filelock>=3.16,<4", "sqlalchemy>=2,<3", "psycopg[binary]>=3,<4", "argon2-cffi>=23,<26", "rank-bm25>=0.2.2,<1", "jieba>=0.42,<1"]
[project.optional-dependencies]
tuning = ["optuna>=4.5,<5"]
tokenizer = ["tokenizers>=0.21,<1"]
local = ["langchain-huggingface>=0.3,<2", "sentence-transformers>=3,<6"]
test = ["pytest>=8,<10"]
[project.scripts]
qiye-rag = "qiye_rag.rag.cli:main"
qiye-rag-v2 = "qiye_rag.graph.__main__:main"
qiye-rag-web = "qiye_rag.web.__main__:main"
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"qiye_rag.web" = ["static/*.html"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

